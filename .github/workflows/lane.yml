# lane.yml — the PR lane's gate and door (WRITES.md is the doctrine; this is the
# machinery). Judges a pull request into a household's own draft/<login>
# sketchbook by the World's OWN law, and merges it when green.
#
# ── security model, stated where it can be audited ───────────────────────────
# This runs on pull_request_target: the BASE repo's workflow, with a token that
# can push and merge. Two invariants keep that safe against a hostile fork:
#   1. TOOLS AND REGISTRY FROM MAIN. Every executed file (lane-wall, mark-lint,
#      marks-fold) and the identity registry come from the MAIN checkout — the
#      same trust anchor this workflow file is read from. Not from the head
#      (hostile) and not from the sketchbook either: a sketchbook is only as
#      fresh as its last crossing, and the first live run failed exactly there
#      (draft/keeminlee predated the lane's own tools). The sketchbook
#      contributes only the tree being judged.
#   2. CONTENT AS DATA. The head contributes only WORLD/marks/** and NOTES/*
#      files, applied as a diff — and only after the path law has refused
#      everything else. Mark records are parsed, never imported or evaluated.
# No npm install. No scripts from the PR. Node + git + gh only.
#
# ── what it does ─────────────────────────────────────────────────────────────
# PR into draft/<login>  → wall (authorship + placement) → lint → fold →
#                          squash-merge on green; violations commented on red.
# PR into main, lane paths only, author registered, no sketchbook yet
#                        → create draft/<login> at main, retarget the PR to it
#                          (the bootstrap: a first-time author needs no branch
#                          to exist before they knock).
# PR into main touching anything else → not this lane; ordinary human review.

name: lane
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: lane-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  gate:
    if: github.repository == 'keeminlee/postmark-world'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      AUTHOR_ID: ${{ github.event.pull_request.user.id }}
      AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
    steps:
      - name: main checkout (the trusted side — every tool and the registry run from here)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: fetch the base and the head as data
        run: |
          git fetch --no-tags origin "pull/${PR}/head:pr-head"
          git fetch --no-tags origin "${BASE_REF}"

      - name: path law (before anything from the head is even copied)
        id: paths
        run: |
          BASE_SHA=$(git merge-base "origin/${BASE_REF}" pr-head)
          git diff --name-only "$BASE_SHA" pr-head > /tmp/changed
          echo "changed files:"; cat /tmp/changed
          if [ ! -s /tmp/changed ]; then echo "empty diff — nothing to judge" && echo "lane=none" >> "$GITHUB_OUTPUT" && exit 0; fi
          if grep -qvE '^(WORLD/marks/.+/mark\.md|NOTES/[a-z0-9-]+\.md)$' /tmp/changed; then
            echo "lane=no" >> "$GITHUB_OUTPUT"
          else
            echo "lane=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: "not the lane: a main-targeted PR with non-lane paths is ordinary review"
        if: steps.paths.outputs.lane != 'yes' && env.BASE_REF == 'main'
        run: echo "not lane traffic — a human reads this one. nothing enforced here."

      - name: "refuse: a sketchbook PR must carry only lane paths"
        if: steps.paths.outputs.lane == 'no' && startsWith(env.BASE_REF, 'draft/')
        run: |
          gh pr comment "$PR" --body "refused: this lane carries mark records (\`WORLD/marks/**/mark.md\`) and your own notes (\`NOTES/<handle>.md\`) only. Anything else — tools, canon, others' files — goes to an ordinary PR against \`main\` for human review. (\`WRITES.md\` is the map.)"
          exit 1

      - name: "bootstrap: first knock — create the sketchbook and retarget"
        if: steps.paths.outputs.lane == 'yes' && env.BASE_REF == 'main'
        run: |
          # the registry is the base's; bind the author to a household before making ground
          BOUND=$(node -e '
            const r = JSON.parse(require("fs").readFileSync("WORLD/households.json", "utf8"));
            const keys = new Set([`gh:${process.env.AUTHOR_ID}`, `login:${process.env.AUTHOR_LOGIN.toLowerCase()}`]);
            console.log(Object.values(r.households ?? {}).some((k) => keys.has(k)) ? "yes" : "no");
          ')
          if [ "$BOUND" != "yes" ]; then
            gh pr comment "$PR" --body "refused: no resident handle is registered to your GitHub account yet (\`WORLD/households.json\`, refreshed from the town pins). Join the town first — \`JOINING.md\` in the postmark repo — or use the office door meanwhile."
            exit 1
          fi
          BRANCH="draft/${AUTHOR_LOGIN}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "sketchbook exists — retargeting only"
          else
            git push origin "origin/main:refs/heads/${BRANCH}"
            echo "created ${BRANCH} at main"
          fi
          gh pr edit "$PR" --base "$BRANCH"
          gh pr comment "$PR" --body "your sketchbook is \`${BRANCH}\` — this PR now targets it. The gate runs on the retargeted PR; green merges on its own. (\`WRITES.md\` § the lane.)"

      - name: compose (the sketchbook tree + the head's lane diff, in a worktree — never a checkout of head)
        if: steps.paths.outputs.lane == 'yes' && startsWith(env.BASE_REF, 'draft/')
        run: |
          BASE_SHA=$(git merge-base "origin/${BASE_REF}" pr-head)
          git worktree add /tmp/sketch "origin/${BASE_REF}"
          if ! git diff "$BASE_SHA" pr-head -- 'WORLD/marks' 'NOTES' | git -C /tmp/sketch apply; then
            gh pr comment "$PR" --body "refused: this PR no longer applies to the current sketchbook — a Settlement crossing has rebased it under you (twice daily, 06:00Z and 18:00Z). Rebase and push again: \`git fetch origin && git rebase origin/${BASE_REF}\`. Additive marks in your own namespace rarely conflict; straddling a crossing is the one case that does. (\`WRITES.md\` § the crossings.)"
            exit 1
          fi

      - name: the wall, the lint, the fold — main's tools judging the composed sketchbook
        if: steps.paths.outputs.lane == 'yes' && startsWith(env.BASE_REF, 'draft/')
        run: |
          set +e
          node tools/lane-wall.mjs \
            --author-id "$AUTHOR_ID" --author-login "$AUTHOR_LOGIN" \
            --base "origin/${BASE_REF}" --head pr-head \
            --base-branch "$BASE_REF" \
            --registry WORLD/households.json \
            --marks-dir /tmp/sketch/WORLD/marks 2> /tmp/wall.err
          WALL=$?
          node tools/mark-lint.mjs --marks-dir /tmp/sketch/WORLD/marks --terrain /tmp/sketch/WORLD/skeleton.json > /tmp/lint.out 2>&1; LINT=$?
          # exit 3 is REPAIR NEEDED, not refused (mark-lint § three exit codes):
          # no errors, but some directory edge wants re-pointing because a mark
          # that OUTRANKS what it is filed under has had geometry drift around
          # it. The settlement sweep performs that at the crossing, and nothing
          # moves when it does — so this must not bounce the writer. It is
          # usually not even their mark: the commonest cause is a lawful new
          # claim growing around somebody else's. Without this line the lane
          # refuses on `-ne 0` and prints an EMPTY reason, because the comment
          # below greps for ERROR lines and a re-home is not one.
          REHOME=0
          if [ $LINT -eq 3 ]; then REHOME=1; LINT=0; fi
          node tools/marks-fold.mjs --marks-dir /tmp/sketch/WORLD/marks --terrain /tmp/sketch/WORLD/skeleton.json --no-write --json > /tmp/fold.json 2> /tmp/fold.err; FOLD=$?
          set -e
          if [ $FOLD -eq 0 ]; then
            FOLD=$(node -e 'const s = JSON.parse(require("fs").readFileSync("/tmp/fold.json","utf8")); const n = s.errors?.length ?? 0; if (n) console.error(JSON.stringify(s.errors[0])); process.exit(n ? 1 : 0);' 2>> /tmp/fold.err; echo $?)
          fi
          if [ $WALL -ne 0 ] || [ $LINT -ne 0 ] || [ "$FOLD" != "0" ]; then
            { echo "the gate refused this one — each line names its fix:"; echo '```'
              [ $WALL -ne 0 ] && cat /tmp/wall.err
              [ $LINT -ne 0 ] && grep -a "ERROR" /tmp/lint.out || true
              [ "$FOLD" != "0" ] && cat /tmp/fold.err
              echo '```'
              echo "pre-flight locally and the gate has nothing to say: \`node tools/place-mark.mjs\` for the path, \`node tools/mark-lint.mjs\` for the record, \`node tools/lane-wall.mjs\` for authorship. (\`WRITES.md\`.)"
            } > /tmp/comment.md
            gh pr comment "$PR" --body-file /tmp/comment.md
            exit 1
          fi
          if [ $REHOME -eq 1 ]; then
            grep -a "REHOME" /tmp/lint.out || true
            echo "wall + lint + fold: green — with re-home(s) above, which the crossing re-points; no mark moves"
          else
            echo "wall + lint + fold: green"
          fi

      - name: green merges on its own (the registrar precedent — the law is the gate)
        if: steps.paths.outputs.lane == 'yes' && startsWith(env.BASE_REF, 'draft/')
        # --match-head-commit: merge exactly the head this run judged — a push
        # racing the gate re-fires the gate instead of riding a stale verdict
        run: gh pr merge "$PR" --squash --match-head-commit "$(git rev-parse pr-head)"
